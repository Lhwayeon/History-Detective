.mk{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;display:grid;justify-items:center;gap:4px;font:inherit;z-index:2}
.pin {
  width: clamp(64px, 7.5vw, 96px);
  aspect-ratio: 1;
  border-radius: 50%;

  background:
    radial-gradient(circle at 35% 30%, #ffffff55, transparent 45%),
    linear-gradient(145deg, var(--c), #263e50);

  border: 5px solid #e9c66d;

  box-shadow:
    0 0 0 3px #fff,

  place-items: center;

  content: "";

  z-index: 1;
  filter: drop-shadow(0 2px 2px #0005);
}

      0 0 0 3px #fff,
      0 5px 0 #8c682c,
      0 8px 15px #0006,
      inset 0 0 0 3px #ffffff55;

      0 0 0 3px #fff,
      0 5px 0 #8c682c,
      0 8px 20px #0008,
      0 0 16px #f5d77b,
      inset 0 0 0 3px #ffffff88;
  }
}

.stk.on{border-color:var(--ink);transform:rotate(2deg) scale(1.08)}.stk:disabled{opacity:.5;cursor:not-allowed}.stk.pop{animation:stamp .5s}@keyframes stamp{0%{transform:scale(2.4) rotate(-25deg);opacity:0}70%{transform:scale(.9)}100%{transform:rotate(2deg) scale(1.08);opacity:1}}

/* ===== v3: 글꼴·에셋 경로·지도 좌표(여기서 수정) ===== */
:root{--pin:clamp(56px,7.5vw,92px);--map-ar:5/3;--map-r:1.667}
body{background:#f6e7c1;font-family:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,textarea,select{font-family:inherit}
.f-title,.tbox h1,.term h2{font-family:"Gugi","Jua","Malgun Gothic",sans-serif}
#dlg p,.f-npc,.npc em,#dlg .nm{font-family:"Nanum Pen Script","Jua","Malgun Gothic",cursive}#dlg p{font-size:1.9rem;line-height:1.3}
/* .art 높이 붕괴(지도·NPC가 안 보이던 원인) 수정 */
.npc{
  width:clamp(160px,18vw,250px);
  height:calc(clamp(160px,18vw,250px)*5/3);
  aspect-ratio:auto;
}
.npc>.art,.pt>.art,.who>.art,.cap>.art,.bd>.art,.mapbox>.art{position:absolute;inset:0}
.pt,.who,.cap,.bd{position:relative}.cap{height:calc(clamp(150px,18vw,230px)*1.3);aspect-ratio:auto}.bd{height:min(260px,50vw)}
.mapbox{aspect-ratio:var(--map-ar);width:min(100vw,calc((100vh - 100px)*var(--map-r)))}
.pin{width:var(--pin)}
.mk.r1{left:50%;top:63%}.mk.r2{left:22.5%;top:50%}.mk.r3{left:26%;top:17%}.mk.r4{left:64%;top:33%}
.mk.ready .pin {
  border-color: #fff2a6;
  filter: brightness(1.12);
  animation: questGlow 1.3s ease-in-out infinite;
}
.bm{position:absolute;right:-18px;bottom:-18px;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--gold);z-index:2}.bm>.art{position:absolute;inset:3px;width:auto;height:auto}
#tdr{position:fixed;top:130px;right:10px;bottom:10px;width:min(580px,94vw);z-index:35;overflow:auto;background:rgba(15,76,92,.96);color:#fff;border:3px solid var(--gold);border-radius:18px;padding:14px}#tdr[hidden]{display:none}#tdr h3{margin:0}#tdr h4{margin:14px 0 4px;color:var(--gold)}#tdr .cg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}#tdr .btn{padding:6px 12px;font-size:.9rem}#tdr table{color:#fff;font-size:.85rem}#tdr td,#tdr th{border-color:#fff3}
.term .ok{color:#9be0b8}
/* 메인 화면 캐릭터 크기 */
.who {
  width: 220px !important;
  height: 340px !important;
  margin: 15px auto !important;
}

.who .art {
  width: 100%;
  height: 100%;
}
/* 지역별 NPC 크기 */
.npc {
  width: clamp(180px, 22vw, 280px) !important;
  height: auto !important;
  aspect-ratio: 3 / 5 !important;
}
/* NPC 크기 강제 확대 */
.npc {
  width: 480px !important;
  height: 800px !important;
}

.npc .art {
  width: 100% !important;
  height: 100% !important;
}

.npc .art img {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  object-fit: contain !important;
  transform: scale(0.8) !important;
  transform-origin: bottom center !important;
}
/* NPC 대화하기 안내 복구 */
.npc .arrow {
  display: block !important;
  position: absolute !important;
  top: 210px !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  z-index: 9999 !important;
  white-space: nowrap;
  cursor: pointer;
}
/* 대화하기 버튼 강조 애니메이션 */
@keyframes talkPulse {
  0%, 100% {
    transform: translate(-50%, 0) scale(1);
  }
  50% {
    transform: translate(-50%, -10px) scale(1.12);
  }
}

/* 대화하기 버튼 강조 애니메이션 */
@keyframes talkPulse {
  0%, 100% {
    transform: translate(-50%, 0) scale(1);
  }
  50% {
    transform: translate(-50%, -10px) scale(1.12);
  }
}

/* 메인 화면 안내자 이미지 */
.login-character {
  width: 340px;
  height: 350px;
  object-fit: contain;
  display: block;
  margin: 0 auto;
}

.who {
  position: relative;
  left: -60px;
  top: 9px;
}

.mk.r1 { /* 아라비아반도 */
  left: 51%;
  top: 69%;
}

.mk.r2 { /* 이집트 */
  left: 34%;
  top: 50%;
}

.mk.r3 { /* 오스만 제국 */
  left: 30%;
  top: 26%;
}

.mk.r4 { /* 이란 */
  left: 64%;
  top: 36%;
}

/* 지역 미션 배경 이미지 크기 조절 */
#bg .art {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* 지역 미션 배경만 크기 조절 */
#bg .region-bg {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

#bg .region-bg img {
  width: 80vw !important;
  height: 80vh !important;
  object-fit: contain !important;
  position: absolute !important;
  top: 50% !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
}
/* 지도는 추가한 PNG 이미지만 표시 */
.mapbox {
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
  left: 0;
  top: 0;
  transform: none;
  aspect-ratio: auto;
  border: none;
  border-radius: 0;
  box-shadow: none;
  overflow: hidden;
  background: #e8dfc9;
}

.map-only {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border: none;
  border-radius: 0;
}

.npc > .art {
  position: absolute;
  inset: 0;
}

.npc {
  width: clamp(360px, 35vw, 480px);
  height: auto;
  aspect-ratio: 3 / 5;
}
.npc .art {
  width: 100%;
  height: 100%;
}

.npc .art img {
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
}

  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr));

  /* 학습 목표 */

    font-size: 0.72rem;
    line-height: 1.25;
    padding: 6px 8px;
    border-width: 2px;
    border-radius: 10px;
  }

  /* 상단 메뉴 */
  #hud {
    top: 104px;
    left: 6px;
    right: 6px;
    gap: 5px;
    justify-content: center;
    padding: 6px;
    border-radius: 12px;
  }

  #hud .loc {
    width: 100%;
    text-align: center;
    margin: 0;
  }

  .pg {
    width: 120px;
    height: 22px;
  }

async function resetStudent(uid,nickname,isSelf=false){
  if(!uid || (uid===me && !isSelf))return;

  const targetName = isSelf ? '교사 본인' : `${nickname} 학생`;

  if(!confirm(`${targetName}의 학습 기록을 초기화할까요?\n${isSelf ? '게시글·댓글·투표와 다른 학생의 기록은 유지됩니다.' : '다른 학생의 기록은 삭제되지 않습니다.'}`))return;

  if(prompt(`초기화 확인을 위해 ${isSelf ? '교사 닉네임' : '학생 닉네임'} "${nickname}"을 입력하세요.`)!==nickname){
    alert('닉네임이 일치하지 않아 취소했습니다.');
    return;
  }

  try{
    // 학습 진행 기록과 배지만 조회
    const [progressSnap,awardsSnap]=await Promise.all([
      getDocs(collection(db,'students',uid,'progress')),
      getDocs(collection(db,'students',uid,'awards'))
    ]);

    // 학생 초기화일 때만 게시글·댓글·투표 처리
    if(!isSelf){
      const [postsSnap,votesSnap,commentsSnap]=await Promise.all([
        getDocs(query(collection(db,'posts'),where('authorUid','==',uid))),
        getDocs(query(collection(db,'votes'),where('uid','==',uid))),
        getDocs(query(collection(db,'comments'),where('authorUid','==',uid)))
      ]);

      const postIds=new Set(postsSnap.docs.map(d=>d.id));

      const [postComments,postVotes]=await Promise.all([
        Promise.all([...postIds].map(id=>
          getDocs(query(collection(db,'comments'),where('postId','==',id)))
        )),
        Promise.all([...postIds].map(id=>
          getDocs(query(collection(db,'votes'),where('postId','==',id)))
        ))
      ]);

      const comments=new Map();
      [...commentsSnap.docs,...postComments.flatMap(s=>s.docs)]
        .forEach(d=>comments.set(d.id,d));

      const votes=new Map();
      [...votesSnap.docs,...postVotes.flatMap(s=>s.docs)]
        .forEach(d=>votes.set(d.id,d));

      // 다른 학생 게시글에 남긴 투표는 투표 수까지 조정
      for(const v of votes.values()){
        const x=v.data();

        if(!postIds.has(x.postId)){
          const pr=doc(db,'posts',x.postId);
          const ps=await getDoc(pr);

          if(ps.exists()){
            const counts={e:0,s:0,w:0,...ps.data().counts};
            counts[x.type]=Math.max(0,counts[x.type]-1);
            await updateDoc(pr,{counts});
          }
        }

        await deleteDoc(v.ref);
      }

      // 댓글 삭제
      for(const c of comments.values()){
        await deleteDoc(c.ref);
      }

      // 해당 학생이 작성한 게시글 삭제
      for(const p of postsSnap.docs){
        await deleteDoc(p.ref);
      }
    }

    // 미션 기록과 배지 삭제
    for(const p of progressSnap.docs){
      await deleteDoc(p.ref);
    }

    for(const a of awardsSnap.docs){
      await deleteDoc(a.ref);
    }

    // 학생 기본 정보 삭제
    await deleteDoc(doc(db,'students',uid));

    if(isSelf){
      S=null;
      AW={};
      PR={};
      scr='reg';
      alert('교사 본인의 학습 기록이 초기화되었습니다. 처음부터 다시 등록해 주세요.');
      render();
    }else{
      alert(`${nickname} 학생의 기록 초기화가 완료되었습니다.`);
    }

  }catch(e){
    console.error('학생 초기화 오류:',e);
    alert('초기화 중 오류가 발생했습니다: '+e.message);
  }
}

   try{if(myV[p.id]!==s.dataset.k)burst(x.left+20,x.top,[s.textContent.trim()[0]]);await vote(p,s.dataset.k)
   }catch(er){
  console.error('투표 실패:',er);
  toast('투표 실패: '+er.code);
}
  }
  if(e.target.closest('[data-ed]')){
  editing.add(p.id);const d=c.querySelector('.ed');d.hidden=false;c.querySelector('.body').hidden=true;
   d.innerHTML=['claim','evidence','interpretation','question'].map(k=>`<textarea data-k2=${k} rows=2>${esc(p[k])}</textarea>`).join('')+`<button class="btn go" data-sv>저장</button> <button class=btn data-cx>취소</button>`}
  if(e.target.closest('[data-cx]')){editing.delete(p.id);c.querySelector('.ed').hidden=true;c.querySelector('.body').hidden=false;paint()}
  if(e.target.closest('[data-sv]')){const o={};c.querySelectorAll('[data-k2]').forEach(t=>o[t.dataset.k2]=t.value.trim());
   await updateDoc(doc(db,'posts',p.id),{...o,updatedAt:Date.now(),edited:true});editing.delete(p.id);c.querySelector('.ed').hidden=true;c.querySelector('.body').hidden=false;toast('✏️ 수정했어요');paint()}
  if(e.target.closest('[data-cm]')&&!T){const i=c.querySelector('.cf input'),t=i.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{postId:p.id,authorUid:me,nickname:S.nickname,text:t,at:Date.now()});i.value=''}});

 function vEnd(){setBg(SC.title(),'bg-end');app.innerHTML=`<div class=card style="text-align:center"><div class=scene style="background:var(--sky)">🌀🕰️</div><h2>시간 여행의 끝</h2><p>🎯 <b>학습 목표</b><br> 1. 서아시아 각 지역에서 나타난 국민 국가 건설 운동의 전개 과정과 주요 특징을 설명할 수 있다.<br>
    2. 서아시아의 국민 국가 건설 과정에서 나타난 내부적 개혁의 한계와 제국주의 열강의 간섭을 분석할 수 있다.</p></div>
  <div class=ticket><h3>🎫 출구 티켓</h3><p>시간 여행자 <b>${esc(S.nickname)}</b> · 배지 ${[1,2,3,4].filter(i=>S.badges?.['b'+i]).length}/4<br>티켓 번호 ${me.slice(0,6).toUpperCase()}-${new Date().toLocaleDateString('ko-KR')}</p>
  <textarea id=xn rows=2 placeholder="출구 티켓: 오늘 새롭게 알게 된 점 한 줄"></textarea><button class="btn go" id=xb>🚪 시간 여행 탈출하기</button></div>`;
  $('#xb').onclick=async()=>{await updateDoc(doc(db,'students',me),{exited:true,exitNote:$('#xn').value.trim(),exitAt:Date.now()});burst();$('#hud').innerHTML='';app.innerHTML=`<div class=card style="text-align:center"><div class=scene style="background:var(--mint)">🚪✨</div><h2>탈출 성공! 수고했어요, 여행자님</h2></div>`}}
}
